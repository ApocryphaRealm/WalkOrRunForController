; Walk or Run for Controller. The slider is in the game's own menu: Journal, System, Settings, Gameplay.

[Debug]
; 2 = info. Lower numbers write more to My Games\Skyrim Special Edition\SKSE\MovementSpeedSlider.log.
uLogLevel=2

[General]
; The player's movement speed in percent, 25 to 150, one value for Run and one for Walk. 100 changes nothing. The slider
; shows and writes the selected Default Motion's. Sprint uses the Run value.
iRunSpeedPercent=100
iWalkSpeedPercent=100

; Default Motion, written by its row: 0 = Run, as the game. 1 = Walk. 2 = Walk, run after sprint: letting go of Sprint keeps
; you running until you stop moving. 3 = Walk sheathed, run drawn: walk while the weapon or magic is put away, run while it is out.
; (Before 1.2.0 this was bWalkByDefault and bRunAfterSprint; an INI that still has them is read and rewritten.)
iDefaultMotion=0
